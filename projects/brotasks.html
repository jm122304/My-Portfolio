<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BroTasks | Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07071a;--panel:#11112b;--card:#17173a;--line:#2a2a52;--text:#f2f2fa;--mute:#9a9ab8;--accent:#7b5cf5;--hi:#ff6b81;--md:#ffb84d;--lo:#2bd48a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid #ffe600;outline-offset:2px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-family:Manrope,Inter,sans-serif}
input,select,textarea{width:100%;background:#0a0a22;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit;font-size:.9rem}
header{padding:22px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.7rem}h1 b{color:#a21fff}
.sub{color:var(--mute);font-size:.88rem}
.btn{background:var(--accent);border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:.9rem;transition:filter .2s}
.btn:hover{filter:brightness(1.15)}.btn.g{background:none;border:1px solid var(--line)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.st b{display:block;font-family:Manrope;font-size:1.6rem}.st span{color:var(--mute);font-size:.78rem}
.bar{height:6px;border-radius:9px;background:#26264a;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7b5cf5,#2bd48a);transition:width .4s}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input{flex:1;min-width:180px}.tools select{width:auto}

.tabs{display:none;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-size:.82rem;font-weight:600}
.tabs button.on{background:var(--accent);border-color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:50px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:260px;transition:border-color .2s}
.col.over{border-color:var(--accent);background:#17163a}
.col h2{font-size:1rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.col h2 span{font-size:.75rem;background:#26264a;border-radius:99px;padding:2px 10px;color:var(--mute)}
.list{display:grid;gap:10px;min-height:60px}
.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px;cursor:grab}
.task.drag{opacity:.4}
.task h3{font-size:.93rem;font-weight:600;word-break:break-word}
.done .task h3{text-decoration:line-through;color:var(--mute)}
.task p{font-size:.8rem;color:var(--mute);margin-top:3px;word-break:break-word}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:.72rem}
.meta i{font-style:normal;border-radius:99px;padding:2px 9px;background:#ffffff12;color:var(--mute)}
.meta i.late{background:#ff6b8130;color:var(--hi)}
.acts{display:flex;gap:6px;margin-top:10px}
.acts button{flex:1;background:#ffffff0d;border:0;border-radius:8px;padding:5px 0;font-size:.78rem}
.acts button:hover{background:#ffffff22}
.empty{color:var(--mute);font-size:.82rem;text-align:center;padding:18px 0}

dialog{margin:auto;background:var(--panel);color:var(--text);border:1px solid var(--accent);border-radius:18px;padding:24px;width:min(440px,92%)}
dialog::backdrop{background:#000b}
dialog h2{font-size:1.25rem;margin-bottom:6px}
label{display:block;font-size:.78rem;color:var(--mute);margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fa{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#fff;color:#111;padding:10px 18px;border-radius:99px;font-weight:600;font-size:.85rem;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:820px){
 .stats{grid-template-columns:1fr 1fr}
 .tabs{display:flex}
 .board{grid-template-columns:1fr}
 .col{display:none}.board[data-a="todo"] [data-s="todo"],.board[data-a="doing"] [data-s="doing"],.board[data-a="done"] [data-s="done"]{display:block}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Bro<b>Tasks</b></h1><div class="sub" id="today"></div></div>
    <button class="btn" id="new">+ New task</button>
  </header>

  <section class="stats" aria-label="Summary">
    <div class="st"><b id="s1">0</b><span>Total tasks</span></div>
    <div class="st"><b id="s2">0</b><span>In progress</span></div>
    <div class="st"><b id="s3">0</b><span>Overdue</span></div>
    <div class="st"><b id="s4">0%</b><span>Completed</span><div class="bar"><i id="pb" style="width:0"></i></div></div>
  </section>

  <div class="tools">
    <input id="q" type="search" placeholder="Search tasks…" aria-label="Search tasks">
    <select id="fp" aria-label="Filter by priority"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select>
    <button class="btn g" id="clr">Clear completed</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="board" id="board" data-a="todo"></div>
</div>

<dialog id="dlg">
  <form id="f">
    <h2 id="dt">New task</h2>
    <label for="t">Title</label><input id="t" required maxlength="80">
    <label for="d">Notes (optional)</label><textarea id="d" rows="2" maxlength="200"></textarea>
    <div class="two">
      <div><label for="p">Priority</label><select id="p"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
      <div><label for="du">Due date</label><input id="du" type="date"></div>
    </div>
    <div class="fa"><button type="button" class="btn g" id="cx">Cancel</button><button class="btn">Save task</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const COLS=[["todo","To Do"],["doing","In Progress"],["done","Done"]];
const PC={High:"var(--hi)",Medium:"var(--md)",Low:"var(--lo)"};
const iso=d=>d.toISOString().slice(0,10),day=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
let tasks=[],editing=null,tab="todo";
try{tasks=JSON.parse(localStorage.getItem("brotasks"))}catch(e){}
if(!Array.isArray(tasks)){tasks=[
 {id:1,t:"Design portfolio homepage",d:"Hero, projects and contact sections",p:"High",du:day(1),s:"doing"},
 {id:2,t:"Write project descriptions",d:"",p:"Medium",du:day(4),s:"todo"},
 {id:3,t:"Deploy the website",d:"Upload files and test on mobile",p:"Low",du:day(7),s:"todo"},
 {id:4,t:"Set up GitHub repository",d:"",p:"Medium",du:day(-2),s:"done"}]}
const save=()=>{try{localStorage.setItem("brotasks",JSON.stringify(tasks))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const late=t=>t.du&&t.s!="done"&&t.du<day(0);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove("on"),1500)}
$("#today").textContent=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});

function draw(){
 const q=$("#q").value.toLowerCase(),fp=$("#fp").value;
 const vis=tasks.filter(t=>(!fp||t.p==fp)&&(t.t+t.d).toLowerCase().includes(q));
 $("#board").innerHTML=COLS.map(([s,n],ci)=>{
  const l=vis.filter(t=>t.s==s).sort((a,b)=>(a.du||"9")<(b.du||"9")?-1:1);
  return `<section class="col ${s}" data-s="${s}" aria-label="${n}"><h2>${n}<span>${l.length}</span></h2><div class="list">${l.map(t=>`
  <article class="task" draggable="true" data-id="${t.id}" style="--c:${PC[t.p]}"><h3>${esc(t.t)}</h3>${t.d?`<p>${esc(t.d)}</p>`:""}
   <div class="meta"><i>${t.p}</i>${t.du?`<i class="${late(t)?"late":""}">${late(t)?"Overdue · ":"Due "}${new Date(t.du+"T00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}</i>`:""}</div>
   <div class="acts">${ci>0?`<button data-m="-1" aria-label="Move back">◀</button>`:""}<button data-e="1">Edit</button><button data-x="1">Delete</button>${ci<2?`<button data-m="1" aria-label="Move forward">▶</button>`:""}</div></article>`).join("")||`<div class="empty">Nothing here yet</div>`}</div></section>`}).join("");
 $("#tabs").innerHTML=COLS.map(([s,n])=>`<button class="${s==tab?"on":""}" data-tab="${s}">${n} (${tasks.filter(t=>t.s==s).length})</button>`).join("");
 $("#board").dataset.a=tab;
 const dn=tasks.filter(t=>t.s=="done").length,pct=tasks.length?Math.round(dn/tasks.length*100):0;
 $("#s1").textContent=tasks.length;$("#s2").textContent=tasks.filter(t=>t.s=="doing").length;$("#s3").textContent=tasks.filter(late).length;$("#s4").textContent=pct+"%";$("#pb").style.width=pct+"%";
 save();
}

/* actions */
document.addEventListener("click",e=>{
 const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;draw();return}
 const card=e.target.closest(".task");if(!card)return;
 const t=tasks.find(x=>x.id==card.dataset.id),i=COLS.findIndex(c=>c[0]==t.s);
 if(e.target.closest("[data-m]")){t.s=COLS[i+ +e.target.closest("[data-m]").dataset.m][0];tab=t.s;toast("Moved to "+COLS.find(c=>c[0]==t.s)[1]);draw()}
 if(e.target.closest("[data-x]")){tasks=tasks.filter(x=>x!==t);toast("Task deleted");draw()}
 if(e.target.closest("[data-e]"))open(t);
});
function open(t){editing=t||null;$("#dt").textContent=t?"Edit task":"New task";
 $("#t").value=t?t.t:"";$("#d").value=t?t.d:"";$("#p").value=t?t.p:"Medium";$("#du").value=t?t.du:"";$("#dlg").showModal();$("#t").focus()}
$("#new").onclick=()=>open();$("#cx").onclick=()=>$("#dlg").close();
$("#f").onsubmit=e=>{e.preventDefault();
 const v={t:$("#t").value.trim(),d:$("#d").value.trim(),p:$("#p").value,du:$("#du").value};
 if(!v.t)return;
 if(editing)Object.assign(editing,v);else{tasks.push({id:Date.now(),s:tab,...v});}
 toast(editing?"Task updated":"Task added");$("#dlg").close();draw()};
$("#clr").onclick=()=>{const n=tasks.filter(t=>t.s=="done").length;tasks=tasks.filter(t=>t.s!="done");toast(n?`Cleared ${n} completed`:"No completed tasks");draw()};
$("#q").oninput=draw;$("#fp").onchange=draw;

/* drag and drop (desktop) */
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest?.(".task");if(c){dragId=c.dataset.id;c.classList.add("drag");e.dataTransfer.setData("text/plain",dragId)}});
document.addEventListener("dragend",e=>{e.target.classList?.remove("drag");document.querySelectorAll(".col").forEach(c=>c.classList.remove("over"))});
document.addEventListener("dragover",e=>{const c=e.target.closest?.(".col");if(c){e.preventDefault();document.querySelectorAll(".col").forEach(x=>x.classList.toggle("over",x===c))}});
document.addEventListener("drop",e=>{const c=e.target.closest?.(".col");if(!c||!dragId)return;e.preventDefault();
 const t=tasks.find(x=>x.id==dragId);if(t&&t.s!=c.dataset.s){t.s=c.dataset.s;toast("Moved to "+COLS.find(k=>k[0]==t.s)[1])}dragId=null;draw()});
draw();
</script>
</body>
</html>
